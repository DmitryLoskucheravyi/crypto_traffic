services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      # Прокидуємо назовні лише на loopback: потрібно, коли apps/api запущено
      # локально (npm run dev:api), а не в контейнері.
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - crypto-net

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: ${API_PORT}
    ports:
      - "127.0.0.1:${API_PORT}:${API_PORT}"
    depends_on:
      - mongo
    networks:
      - crypto-net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: ${WEB_PORT}
      API_INTERNAL_URL: ${API_INTERNAL_URL}
    ports:
      - "127.0.0.1:${WEB_PORT}:${WEB_PORT}"
    depends_on:
      - api
    networks:
      - crypto-net

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:${API_PORT}"
        NEXT_PUBLIC_BOT_API_URL: "http://localhost:${BOT_PORT}"
    restart: unless-stopped
    environment:
      PORT: ${ADMIN_PORT}
    ports:
      - "127.0.0.1:${ADMIN_PORT}:${ADMIN_PORT}"
    depends_on:
      - api
      - bot
    networks:
      - crypto-net

  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:${BOT_PORT}:${BOT_PORT}"
    volumes:
      - bot-data:/app/prisma
    networks:
      - crypto-net

networks:
  crypto-net:
    driver: bridge

volumes:
  mongo-data:
  bot-data:
