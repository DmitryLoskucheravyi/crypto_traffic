services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      # Наружу — только на loopback: нужно, когда apps/api запущен локально
      # (npm run dev:api), а не в контейнере.
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-data:/data/db
    networks:
      - crypto-net

  # Единственный сервис с состоянием: Telegram-бот и слушатель USDT-кошелька.
  # База осталась ровно под его заказы.
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: ${API_PORT}
    ports:
      - '127.0.0.1:${API_PORT}:${API_PORT}'
    volumes:
      # Материалы курсов не запекаются в образ: образ уезжает в GHCR, а это
      # платный продукт. Только чтение — боту достаточно.
      - ./materials:/app/materials:ro
    depends_on:
      - mongo
    networks:
      - crypto-net

  # Лендинг — статика в nginx. С api не связан: контент вшит в сборку.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - '127.0.0.1:${WEB_PORT}:80'
    networks:
      - crypto-net

networks:
  crypto-net:
    driver: bridge

volumes:
  mongo-data:
