server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # next build --output export кладёт каждую страницу каталогом с index.html
    # (trailingSlash: true), поэтому хватает обычного поиска индекса.
    index index.html;

    # Версию nginx наружу не показываем.
    server_tokens off;

    # Базовые заголовки безопасности. HSTS здесь нет намеренно: HTTPS
    # терминирует внешний прокси, он же и должен его выставлять.
    # always — чтобы заголовки уходили и с ответами 404.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Хешированные ассеты Next можно кэшировать навсегда — имя меняется вместе
    # с содержимым. add_header внутри location отменяет заголовки уровня
    # server, поэтому nosniff повторён.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Несуществующий адрес получает страницу 404 с настоящим кодом 404, а не
    # 200 — иначе поисковик считает её «мягкой» и индексирует мусорные URL.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    gzip on;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 1024;
}
