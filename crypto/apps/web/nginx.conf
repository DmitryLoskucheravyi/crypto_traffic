server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # next build --output export кладёт каждую страницу каталогом с index.html
    # (trailingSlash: true), поэтому хватает обычного поиска индекса.
    index index.html;

    # Хешированные ассеты Next можно кэшировать навсегда — имя меняется вместе
    # с содержимым.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ $uri.html /404.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
