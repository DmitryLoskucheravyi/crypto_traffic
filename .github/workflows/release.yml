name: Release

# CD-половина: на тег v* (или вручную) собирает то, что реально уезжает на
# сервер — образ бота и статику лендинга. Ни один шаг не требует секретов
# сверх штатного GITHUB_TOKEN, поэтому пайплайн работает сразу после пуша.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  api-image:
    name: Образ бота → GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/api
          tags: |
            type=ref,event=tag
            type=sha,format=short
            # Релиз запускается тегом или вручную, и на теге is_default_branch
            # всегда ложен — latest ставим безусловно.
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: crypto
          file: crypto/apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  landing:
    name: Статика лендинга
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: crypto

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crypto/package-lock.json

      - run: npm ci --ignore-scripts

      # Адрес сайта и ссылки запекаются в статику на сборке. Берутся из
      # переменных репозитория (Settings → Variables); пока не заданы, сборка
      # идёт с фолбэками из apps/web/app/lib (localhost и встроенный бот).
      - run: npm run build --workspace apps/web
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${{ vars.NEXT_PUBLIC_TELEGRAM_BOT_USERNAME }}
          NEXT_PUBLIC_TELEGRAM_CHANNEL_USERNAME: ${{ vars.NEXT_PUBLIC_TELEGRAM_CHANNEL_USERNAME }}
          NEXT_PUBLIC_INSTAGRAM_USERNAME: ${{ vars.NEXT_PUBLIC_INSTAGRAM_USERNAME }}

      - name: Архив статики
        run: tar -czf landing-static.tar.gz -C apps/web/out .

      - uses: actions/upload-artifact@v4
        with:
          name: landing-static-${{ github.ref_name }}
          path: crypto/landing-static.tar.gz
          retention-days: 90
          if-no-files-found: error
